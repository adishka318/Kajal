<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajal</title>
   

   
</head>
<body class="text-gray-200 antialiased selection:bg-pink-500 selection:text-white">

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="bg-glow absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-br from-purple-900/20 to-transparent blur-[120px]"></div>
        <div class="bg-glow absolute bottom-[-15%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-gradient-to-tr from-pink-900/15 to-transparent blur-[150px]" style="animation-delay: -3s;"></div>
    </div>

   
	<audio id="bg-music" loop>
            <source src="music/Sitare.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    
    <div class="fixed top-6 right-6 z-50">
        <button id="music-toggle" class="glass-card text-pink-400 p-4 rounded-full flex items-center justify-center transition-all duration-300 hover:scale-110 hover:text-pink-300 shadow-lg group">
            <i id="music-icon" class="fas fa-music text-lg"></i>
            <span class="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 ease-in-out pl-0 group-hover:pl-2 text-xs font-medium tracking-wider text-gray-300 uppercase">Music</span>
        </button>
    </div>

    <section class="relative w-full h-screen flex flex-col items-center justify-between z-10 overflow-hidden py-12 px-4">
        <canvas id="fireworks-canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>

        <div class="text-center mt-8 pointer-events-none z-10">
            <span class="text-xs uppercase tracking-[0.4em] text-pink-400/80 font-medium block mb-2">I want to say Something</span>
            <h2 class="text-2xl md:text-3xl font-light tracking-wide text-white/90">You are Beautiful,innocent and cute ..always remember</h2>
        </div>

        <div class="w-full max-w-xl text-center glass-card p-8 rounded-3xl mx-4 z-10 transition-all duration-700 transform hover:border-pink-500/30">
            <h1 class="text-5xl md:text-7xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-300 mb-4 animate-pulse">
                My Cute Babe
            </h1>
            <p id="typing-text" class="text-sm md:text-base text-gray-300/90 leading-relaxed min-h-[48px] font-normal tracking-wide"></p>
            
            <button onclick="triggerSpecialExplosion()" class="mt-6 px-6 py-2.5 rounded-full bg-gradient-to-r from-pink-500 to-purple-600 text-xs uppercase tracking-widest font-semibold shadow-lg shadow-pink-500/20 hover:shadow-pink-500/40 hover:scale-105 transition-all duration-300">
                <i class="fas fa-sparkles mr-2"></i> Click on this to see magic
            </button>
        </div>

      
    </section>

    

    

    
	
<a style="
        background:red;
        color:white;
        text-decoration:none;
        padding:15px 35px;
        font-size:22px;
        border-radius:10px;
        display:inline-block;"
		href="romance.html">
        <button> Click on this to see our beautiful memories</button>
    </a>
   

    <script>
        // -------------------------------------------------------------
        // AUDIO AUTOPLAY BYPASS SYSTEM
        // -------------------------------------------------------------
        const music = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicIcon = document.getElementById('music-icon');

        function playAudio() {
            if (music.paused) {
                music.play().then(() => {
                    musicIcon.classList.remove('fa-music');
                    musicIcon.classList.add('fa-pause', 'animate-pulse');
                }).catch(e => console.log("Autoplay blocked by browser policy. Awaiting manual trigger.", e));
            }
        }

        // Instantly catch any user interaction to start the music right away
        window.addEventListener('click', playAudio, { once: true });
        window.addEventListener('scroll', playAudio, { once: true });
        window.addEventListener('touchstart', playAudio, { once: true });
        window.addEventListener('keydown', playAudio, { once: true });

        // Manual music toggle
        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation(); // Avoid triggering global listener conflicts
            if (music.paused) {
                music.play();
                musicIcon.classList.remove('fa-music');
                musicIcon.classList.add('fa-pause', 'animate-pulse');
            } else {
                music.pause();
                musicIcon.classList.remove('fa-pause', 'animate-pulse');
                musicIcon.classList.add('fa-music');
            }
        });

        // -------------------------------------------------------------
        // TYPING EFFECT COMPONENT
        // -------------------------------------------------------------
        const typingPhrases = [
            "I am genuinely sorry for speaking harsh and wrong words to you...",
            "Give me one chance to bring that radiant, beautiful smile back.",
            "Your emotional peace and happiness genuinely mean the whole world to me."
        ];
        let currentPhraseIdx = 0;
        let charIdx = 0;
        const typingSpeed = 60;
        const delayBetweenPhrases = 2500;
        const typingTarget = document.getElementById('typing-text');

        function typeWriter() {
            if (charIdx < typingPhrases[currentPhraseIdx].length) {
                typingTarget.innerHTML += typingPhrases[currentPhraseIdx].charAt(charIdx);
                charIdx++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                setTimeout(eraseText, delayBetweenPhrases);
            }
        }

        function eraseText() {
            if (charIdx > 0) {
                typingTarget.innerHTML = typingPhrases[currentPhraseIdx].substring(0, charIdx - 1);
                charIdx--;
                setTimeout(eraseText, typingSpeed / 2);
            } else {
                currentPhraseIdx = (currentPhraseIdx + 1) % typingPhrases.length;
                setTimeout(typeWriter, 500);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeWriter, 1000);
            initCarousel();
        });

        // -------------------------------------------------------------
        // LOVE QUOTES CAROUSEL COMPONENT
        // -------------------------------------------------------------
        const carouselQuotes = [
            "“Every moment without your genuine smile feels utterly incomplete.”",
            "“I promise to carefully listen, gently understand, and grow better for us.”",
            "“Your heart deserves pure care, absolute respect, and untamed happiness.”",
            "“Sorry for letting my momentary frustration eclipse our beautiful reality.”"
        ];
        let carouselIdx = 0;
        function initCarousel() {
            const el = document.getElementById('carousel-text');
            el.innerText = carouselQuotes[carouselIdx];
            setInterval(() => {
                el.style.opacity = 0;
                setTimeout(() => {
                    carouselIdx = (carouselIdx + 1) % carouselQuotes.length;
                    el.innerText = carouselQuotes[carouselIdx];
                    el.style.opacity = 1;
                }, 500);
            }, 4000);
        }

        // -------------------------------------------------------------
        // CANVAS FIREWORKS & TYPOGRAPHY SYSTEM
        // -------------------------------------------------------------
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color, velocityX, velocityY, alphaDecay = 0.015, size = 2) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = velocityX;
                this.vy = velocityY;
                this.alpha = 1;
                this.decay = alphaDecay;
                this.size = size;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.04; 
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(centerX, centerY, colorTheme) {
            const count = 40;
            const colors = colorTheme === 'pink' ? ['#ec4899', '#f43f5e', '#f472b6', '#ffffff'] : ['#a855f7', '#6366f1', '#818cf8', '#ffffff'];
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                const p = new Particle(
                    centerX, 
                    centerY, 
                    colors[Math.floor(Math.random() * colors.length)],
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    0.02,
                    Math.random() * 1.5 + 1
                );
                particles.push(p);
            }
        }

        function createTextFireworks(text) {
            const scratch = document.createElement('canvas');
            const sCtx = scratch.getContext('2d');
            scratch.width = canvas.width;
            scratch.height = canvas.height;
            
            sCtx.fillStyle = '#ffffff';
            const fontSize = canvas.width < 640 ? 28 : 50;
            sCtx.font = `bold ${fontSize}px system-ui, sans-serif`;
            sCtx.textAlign = 'center';
            sCtx.textBaseline = 'middle';
            sCtx.fillText(text, scratch.width / 2, scratch.height * 0.35);

            const imgData = sCtx.getImageData(0, 0, scratch.width, scratch.height).data;
            const step = canvas.width < 640 ? 5 : 4;

            for (let y = 0; y < scratch.height; y += step) {
                for (let x = 0; x < scratch.width; x += step) {
                    const index = (y * scratch.width + x) * 4;
                    if (imgData[index] > 128) {
                        const p = new Particle(
                            x + (Math.random() * 4 - 2),
                            y + (Math.random() * 4 - 2),
                            `hsl(${330 + Math.random() * 40}, 90%, 65%)`,
                            (Math.random() * 0.6 - 0.3),
                            (Math.random() * 0.6 - 0.3),
                            0.008,
                            Math.random() * 1 + 1
                        );
                        particles.push(p);
                    }
                }
            }
        }

        function triggerSpecialExplosion() {
            createExplosion(canvas.width / 2, canvas.height * 0.35, 'pink');
            createExplosion(canvas.width / 4, canvas.height * 0.25, 'purple');
            createExplosion(canvas.width * 0.75, canvas.height * 0.25, 'pink');
            createTextFireworks("HBD Babe");
        }

        let lastLaunchTime = 0;
        function ambientLaunchLoop(now) {
            if (now - lastLaunchTime > 3500) {
                const targetX = Math.random() * (canvas.width * 0.6) + (canvas.width * 0.2);
                const targetY = Math.random() * (canvas.height * 0.3) + (canvas.height * 0.15);
                createExplosion(targetX, targetY, Math.random() > 0.5 ? 'pink' : 'purple');
                lastLaunchTime = now;
            }
        }

        function canvasEngineLoop(timestamp) {
            ctx.fillStyle = 'rgba(6, 2, 20, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ambientLaunchLoop(timestamp);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(canvasEngineLoop);
        }

        setTimeout(() => {
            triggerSpecialExplosion();
        }, 1500);
        requestAnimationFrame(canvasEngineLoop);

        // -------------------------------------------------------------
        // DIGITAL ROSE PETALS GENERATOR
        // -------------------------------------------------------------
        const petalContainer = document.getElementById('rose-petals-container');
        function spawnPetal() {
            if (!petalContainer) return;
            const petal = document.createElement('div');
            petal.className = 'absolute pointer-events-none rounded-full';
            
            const size = Math.random() * 12 + 8;
            const leftStart = Math.random() * 100;
            const duration = Math.random() * 6 + 5;
            const rotationStart = Math.random() * 360;

            petal.style.width = `${size}px`;
            petal.style.height = `${size + 4}px`;
            petal.style.left = `${leftStart}%`;
            petal.style.top = `-20px`;
            petal.style.background = `linear-gradient(135deg, #f43f5e, #be123c)`;
            petal.style.opacity = Math.random() * 0.6 + 0.4;
            petal.style.transform = `rotate(${rotationStart}deg)`;
            petal.style.transition = `transform ${duration}s linear, top ${duration}s linear, left ${duration}s linear`;
            
            petalContainer.appendChild(petal);

            setTimeout(() => {
                petal.style.top = '105%';
                petal.style.left = `${leftStart + (Math.random() * 20 - 10)}%`;
                petal.style.transform = `rotate(${rotationStart + 720}deg)`;
            }, 50);

            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }
        setInterval(spawnPetal, 450);

        // -------------------------------------------------------------
        // FIREFLIES GENERATOR (STARRY SCENE)
        // -------------------------------------------------------------
        const firefliesContainer = document.getElementById('fireflies-container');
        function spawnFirefly() {
            if (!firefliesContainer) return;
            const firefly = document.createElement('div');
            firefly.className = 'absolute bg-yellow-200/60 rounded-full filter blur-[1px] pointer-events-none';
            
            const size = Math.random() * 3 + 2;
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            const duration = Math.random() * 4 + 4;

            firefly.style.width = `${size}px`;
            firefly.style.height = `${size}px`;
            firefly.style.left = `${left}%`;
            firefly.style.top = `${top}%`;
            firefly.style.boxShadow = '0 0 8px #fde047';
            firefly.style.opacity = 0;
            firefly.style.transition = `opacity ${duration/2}s ease-in-out, transform ${duration}s ease-in-out`;

            firefliesContainer.appendChild(firefly);

            setTimeout(() => {
                firefly.style.opacity = Math.random() * 0.7 + 0.3;
                firefly.style.transform = `translate(${Math.random() * 40 - 20}px, ${Math.random() * 40 - 20}px)`;
            }, 100);

            setTimeout(() => {
                firefly.style.opacity = 0;
            }, duration * 500);

            setTimeout(() => {
                firefly.remove();
            }, duration * 1000);
        }
        setInterval(spawnFirefly, 300);
    </script>
</body>
</html>
